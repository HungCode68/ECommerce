openapi: 3.0.0
info:
  title: Cart API
  description: API giỏ hàng và preview thanh toán
  version: 1.0.0

tags:
  - name: Cart
    description: Các API thao tác giỏ hàng của người dùng đã đăng nhập

paths:
  /api/cart:
    get:
      tags:
        - Cart
      summary: Lấy giỏ hàng hiện tại
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Thành công
    post:
      tags:
        - Cart
      summary: Thêm sản phẩm vào giỏ
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddToCartRequest"
      responses:
        "201":
          description: Thêm thành công

  /api/cart/items/{id}:
    put:
      tags:
        - Cart
      summary: Cập nhật số lượng 1 item trong giỏ
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCartItemRequest"
      responses:
        "200":
          description: Cập nhật thành công

  /api/cart/items:
    delete:
      tags:
        - Cart
      summary: Xoá một hoặc nhiều item khỏi giỏ
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoveFromCartRequest"
      responses:
        "200":
          description: Xoá thành công

  /api/cart/checkout-preview:
    post:
      tags:
        - Cart
      summary: Preview thanh toán cho các sản phẩm đã chọn
      description: |
        Trả về đủ dữ liệu để hiển thị block tóm tắt cạnh nút "Mua hàng":
        - Thu gọn: `total_payable`
        - Mở rộng: `sub_total`, `order_discount`, `shipping_fee`, `shipping_discount`, `order_coupon`, `shipping_coupon`
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutPreviewRequest"
      responses:
        "200":
          description: Tính toán thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutPreviewResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    AddToCartRequest:
      type: object
      required: [variant_id, quantity]
      properties:
        product_id:
          type: integer
        variant_id:
          type: integer
        quantity:
          type: integer
          minimum: 1

    UpdateCartItemRequest:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 1

    RemoveFromCartRequest:
      type: object
      required: [variant_ids]
      properties:
        variant_ids:
          type: array
          minItems: 1
          items:
            type: integer

    CheckoutPreviewRequest:
      type: object
      required: [selected_variant_ids]
      properties:
        selected_variant_ids:
          type: array
          minItems: 1
          items:
            type: integer
        coupon_code:
          type: string
          description: Legacy alias của order_coupon_code
        order_coupon_code:
          type: string
          description: Tối đa 1 mã giảm giá tiền hàng
        shipping_coupon_code:
          type: string
          description: Tối đa 1 mã giảm phí ship

    AppliedCouponPreview:
      type: object
      properties:
        coupon_id:
          type: integer
        code:
          type: string
        discount_amount:
          type: number
        message:
          type: string

    CheckoutPreviewResponse:
      type: object
      properties:
        total_price:
          type: number
          description: Alias tương thích ngược của sub_total
        total_items:
          type: integer
        sub_total:
          type: number
        discount_amount:
          type: number
        order_discount:
          type: number
        shipping_fee:
          type: number
        shipping_discount:
          type: number
        total_payable:
          type: number
        order_coupon:
          $ref: "#/components/schemas/AppliedCouponPreview"
        shipping_coupon:
          $ref: "#/components/schemas/AppliedCouponPreview"
        items:
          type: array
          items:
            type: object
            properties:
              item_id:
                type: integer
              product_id:
                type: integer
              product_name:
                type: string
              variant_id:
                type: integer
              variant_name:
                type: string
              price:
                type: number
              quantity:
                type: integer
              sub_total:
                type: number
              stock_check:
                type: boolean
              stock_quantity:
                type: integer
