server {
    listen 80;
    server_name localhost;

    # Kích hoạt nén gzip để tối ưu tốc độ tải trang
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Serve static frontend files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Để React Router hoạt động (chuyển hướng tất cả về index.html)
        try_files $uri $uri/ /index.html;
    }

    # Proxy các request có /api/ đến backend Golang
    location /api/ {
        proxy_pass http://backend:8081; # "backend" là tên service trong docker-compose.yml
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Thêm cấu hình cho thư mục lưu trữ ảnh/upload nội bộ nếu có
    # location /uploads/ {
    #     proxy_pass http://backend:8081;
    # }
}
