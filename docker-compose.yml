version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: ecommerce_db
    restart: always
    environment:
      MYSQL_DATABASE: ECommerce
      MYSQL_USER: dbuser
      MYSQL_PASSWORD: ${DB_PASSWORD_MYSQL:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD_MYSQL:-secret}
    ports:
      - "3307:3306"
    volumes:
      # Data volume để lưu trữ dữ liệu database lâu dài
      - db_data:/var/lib/mysql
      # Mount file Dump để tự động tạo schema & data mẫu (CHỈ chạy khi db rỗng)
      - ./Dump20260611.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    container_name: ecommerce_backend
    restart: always
    # Port 8081 chỉ mở nội bộ, frontend (nginx) sẽ gọi qua mạng docker, nhưng có thể map ra ngoài nếu cần debug
    # ports:
    #   - "8081:8081"
    env_file:
      - .env
    environment:
      - DB_HOST_MYSQL=db
      - DB_PORT_MYSQL=3306
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      network: host
      args:
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
        - VITE_FACEBOOK_APP_ID=${VITE_FACEBOOK_APP_ID}
    container_name: ecommerce_frontend
    restart: always
    ports:
      - "80:80" # Publish port 80 cho Nginx chạy giao diện web
    depends_on:
      - backend

volumes:
  db_data:
