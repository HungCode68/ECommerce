name: Deploy to AWS

on:
  push:
    branches:
      - Update-Backend-Eco  # Mỗi khi push vào nhánh main, nó tự chạy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/ECommerce
            git pull origin Update-Backend-Eco
            docker-compose down
            docker system prune -f
            docker-compose up -d --build